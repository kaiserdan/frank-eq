# Stage-Q development-only screening: stronger ungated checkpoints under the
# corrected chat_turn contract. Same task/panel geometry, fresh dev seed.
# Run cache,validate only; qualify with scripts/qualify_real_cache.py.
run_name: frank-eq-stageq-screen-strong-lumi
output_dir: runs/stageq-screen-strong-lumi
require_revision_pins: true

panel:
  n_worlds: 64
  n_entities: 6
  n_operations: 16
  n_renderers: 2
  train_fraction: 0.65
  validation_fraction: 0.15
  operation_holdout_fraction: 0.25
  oracle_smoothing: 0.02
  min_operation_positive_fraction: 0.12
  max_operation_positive_fraction: 0.88
  max_generation_attempts: 256
  seed: 20260812

models:
  - model_id: qwen3-1.7b
    hf_id: Qwen/Qwen3-1.7B
    role: founder
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  - model_id: qwen3-4b
    hf_id: Qwen/Qwen3-4B
    role: founder
    revision: 1cfa9a7208912126459214e8b04321603b3df60c
  - model_id: smollm-1.7b-instruct-held
    hf_id: HuggingFaceTB/SmolLM-1.7B-Instruct
    role: held
    revision: 69f49d9c36434d6a3f319dadc5bd3b812752b98b

capture:
  normalized_depths: [0.35, 0.60, 0.85]
  max_length: 1024
  dtype: bfloat16
  device: cuda
  answer_token_pairs:
    - [" A", " B"]
    - ["A", "B"]
    - [" No", " Yes"]
  branch_seed: 1729
  branch_batch_size: 8
  local_files_only: true
  prompt_format: chat_turn
  chat_template_kwargs:
    enable_thinking: false
  branch_mode: kv_reuse
  allow_exact_replay_fallback: false
  parity_sample_size: 0
  parity_max_abs_diff: 0.33

logging:
  wandb:
    enabled: true
    project: frank-eq-stagea
    tags: [stageq, lumi, development-only, screen-strong]

model:
  code_dim: 32
  chart_hidden_dim: 160
  operation_hidden_dim: 96
  dropout: 0.05
  quantization_bits: 8
  use_workspace_gate: true
  workspace_l1: 0.0002
  gradient_reversal_weight: 0.10
  decoder_type: graph
  graph_n_entities: 6
  graph_temperature: 4.0
  public_head_scope: shared

losses:
  signature: 1.0
  facts: 0.5
  residual: 0.25
  renderer_invariance: 0.25
  cross_model_invariance: 0.15
  world_contrastive: 0.20
  model_adversary: 0.08
  code_variance_floor: 0.02

training:
  epochs: 80
  onboarding_epochs: 50
  worlds_per_batch: 8
  learning_rate: 0.001
  onboarding_learning_rate: 0.0015
  weight_decay: 0.0001
  gradient_clip: 1.0
  patience: 15
  num_threads: 8
  device: auto
  seed: 1729

evaluation:
  bootstrap_replicates: 2000
  bootstrap_seed: 991
  packet_probe_count: 8
  packet_quantization_bits: 8
  retrieval_chunk_size: 512

gates:
  max_heldout_signature_brier: 0.18
  min_fact_accuracy: 0.70
  min_renderer_cosine: 0.85
  min_cross_model_retrieval_top1: 0.30
  min_wrong_world_margin: 0.03
  min_residual_brier_gain: 0.005
  min_quantization_retention: 0.90
  min_held_model_retention: 0.70
  max_model_leakage_over_chance: 0.25
  min_native_competence_brier_gain: 0.0
  control_checks: [operational_residual]
