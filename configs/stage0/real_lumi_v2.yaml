# Stage-A v2-1 frozen registration (LUMI): native chat-template competence.
# Protocol: docs/14_STAGEA_V2_PROTOCOL.md. Do not edit without a new versioned
# registration and a fresh untouched test role.
run_name: frank-eq-real-stagea-lumi-v2
output_dir: runs/real-stagea-lumi-v2
require_revision_pins: true

panel:
  n_worlds: 64
  n_entities: 6
  n_operations: 16
  n_renderers: 2
  train_fraction: 0.65
  validation_fraction: 0.15
  operation_holdout_fraction: 0.25
  oracle_smoothing: 0.02
  min_operation_positive_fraction: 0.12
  max_operation_positive_fraction: 0.88
  max_generation_attempts: 256
  seed: 20260810

models:
  - model_id: qwen3-0.6b
    hf_id: Qwen/Qwen3-0.6B
    role: founder
    revision: c1899de289a04d12100db370d81485cdf75e47ca
  - model_id: smollm-1.7b-instruct
    hf_id: HuggingFaceTB/SmolLM-1.7B-Instruct
    role: founder
    revision: 69f49d9c36434d6a3f319dadc5bd3b812752b98b
  - model_id: llama-3.2-1b-instruct-held
    hf_id: meta-llama/Llama-3.2-1B-Instruct
    role: held
    revision: 9213176726f574b556790deb65791e0c5aa438b6

capture:
  normalized_depths: [0.35, 0.60, 0.85]
  max_length: 1024
  dtype: bfloat16
  device: cuda
  branch_mode: auto
  allow_exact_replay_fallback: true
  answer_token_pairs:
    - [" A", " B"]
    - ["A", "B"]
    - [" No", " Yes"]
  branch_seed: 1729
  branch_batch_size: 8
  local_files_only: true
  prompt_format: chat
  parity_sample_size: 8
  parity_max_abs_diff: 0.01

logging:
  wandb:
    enabled: true
    project: frank-eq-stagea
    tags: [real-stagea, lumi, v2, chat-template]

model:
  code_dim: 32
  chart_hidden_dim: 160
  operation_hidden_dim: 96
  dropout: 0.05
  quantization_bits: 8
  use_workspace_gate: true
  workspace_l1: 0.0002
  gradient_reversal_weight: 0.10
  decoder_type: graph
  graph_n_entities: 6
  graph_temperature: 4.0
  public_head_scope: shared

losses:
  signature: 1.0
  facts: 0.5
  residual: 0.25
  renderer_invariance: 0.25
  cross_model_invariance: 0.15
  world_contrastive: 0.20
  model_adversary: 0.08
  code_variance_floor: 0.02

training:
  epochs: 80
  onboarding_epochs: 50
  worlds_per_batch: 8
  learning_rate: 0.001
  onboarding_learning_rate: 0.0015
  weight_decay: 0.0001
  gradient_clip: 1.0
  patience: 15
  num_threads: 8
  device: auto
  seed: 1729

evaluation:
  bootstrap_replicates: 2000
  bootstrap_seed: 991
  packet_probe_count: 8
  packet_quantization_bits: 8
  retrieval_chunk_size: 512

gates:
  max_heldout_signature_brier: 0.18
  min_fact_accuracy: 0.70
  min_renderer_cosine: 0.85
  min_cross_model_retrieval_top1: 0.30
  min_wrong_world_margin: 0.03
  min_residual_brier_gain: 0.005
  min_quantization_retention: 0.90
  min_held_model_retention: 0.70
  max_model_leakage_over_chance: 0.25
  min_native_competence_brier_gain: 0.0
  control_checks: [operational_residual]
