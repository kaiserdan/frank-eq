name: psr0-fix

on:
  push:
    branches:
      - agent/predictive-state-psr0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/predictive-state-psr0
          fetch-depth: 0
      - name: Apply deterministic Ruff fixes
        run: |
          python -m pip install ruff
          ruff check --fix src scripts tests
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests
          git commit -m 'Fix PSR0 lint findings'
          git push origin HEAD:agent/predictive-state-psr0
