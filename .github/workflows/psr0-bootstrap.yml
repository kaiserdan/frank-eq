name: psr0-bootstrap

on:
  push:
    branches:
      - agent/predictive-state-psr0

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/predictive-state-psr0
          fetch-depth: 0
      - name: Unpack staged PSR0 implementation
        run: |
          cat .psr0-upload/part00 \
              .psr0-upload/part01a0 \
              .psr0-upload/part01a1 \
              .psr0-upload/part01b \
              .psr0-upload/part02 \
              .psr0-upload/part03 \
              .psr0-upload/part04 \
              .psr0-upload/part05 \
              .psr0-upload/part06 \
              .psr0-upload/part07 > /tmp/psr0.tar.gz
          echo 'c2e7134cb85bf6c6b3a3a9d59e13b741d1203649f83b076cfd704359dc554ed2  /tmp/psr0.tar.gz' | sha256sum -c -
          tar -xzf /tmp/psr0.tar.gz -C .
          rm -rf .psr0-upload
          git checkout HEAD -- .github/workflows/ci.yml
      - name: Commit exact implementation tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement predictive-state PSR0 Olivia audit'
          git push origin HEAD:agent/predictive-state-psr0
