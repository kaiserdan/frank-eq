name: psr0-regenerate-plan

on:
  push:
    branches:
      - agent/predictive-state-psr0

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/predictive-state-psr0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plan dependencies
        run: |
          python -m pip install numpy PyYAML
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Regenerate exact inspected plan and references
        run: |
          python scripts/predictive_state_cli.py plan \
            --config configs/predictive_state/real_olivia_psr0.yaml \
            --out configs/predictive_state/inspected_plan.json > /tmp/plan-output.json
          python - <<'PY'
          import json
          from pathlib import Path

          old = 'ecad5644536542b29db2dbffc62687a174f828cab307163fe8b0ade55128367c'
          plan = json.loads(Path('configs/predictive_state/inspected_plan.json').read_text())
          new = plan['plan_sha256']
          for root in (Path('README.md'), Path('HANDOFF.md'), Path('AGENTS.md'), Path('docs')):
              paths = [root] if root.is_file() else list(root.rglob('*.md'))
              for path in paths:
                  text = path.read_text()
                  if old in text:
                      path.write_text(text.replace(old, new))
          print(new)
          PY
          python scripts/validate_predictive_state.py
      - name: Commit regenerated contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/predictive_state/inspected_plan.json README.md HANDOFF.md AGENTS.md docs
          git commit -m 'Regenerate frozen PSR0 inspected plan'
          git push origin HEAD:agent/predictive-state-psr0
