name: bootstrap-frank-eq

on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize repository
        run: python .bootstrap_payload/bootstrap.py
      - name: Install validation dependencies
        run: |
          python -m pip install numpy PyYAML pytest ruff
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Validate implementation
        run: |
          python -m compileall -q src scripts
          ruff check src scripts tests --fix --unsafe-fixes
          ruff check src scripts tests
          pytest -q
          python scripts/validate_repo.py
      - name: Publish implementation without workflow changes
        run: |
          rm -rf .bootstrap_payload src/frank_eq.egg-info
          rm -f .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement future-defined equivalence quotient Stage 0"
          git push
