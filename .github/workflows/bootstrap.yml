name: bootstrap-frank-eq

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize repository
        run: python .bootstrap_payload/bootstrap.py
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate implementation
        run: |
          python -m compileall -q src scripts
          ruff check .
          pytest -q
          python scripts/validate_repo.py
      - name: Commit implementation
        run: |
          rm -rf .bootstrap_payload
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement future-defined equivalence quotient Stage 0"
          git push
