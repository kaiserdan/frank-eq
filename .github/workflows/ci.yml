name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install numpy PyYAML pytest ruff
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q src scripts olivia lumi
      - name: Lint
        run: ruff check --output-format=github src scripts tests
      - name: Test
        run: pytest -q
      - name: Shell syntax
        run: bash -n olivia/*.sh olivia/*.slurm lumi/*.sh lumi/*.slurm
      - name: Validate repository
        run: |
          python scripts/validate_repo.py
          python scripts/validate_rate_compute.py
          python scripts/validate_moment_compute.py
          python scripts/validate_spq0.py
