[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frank-eq"
version = "0.2.0"
description = "Future-defined operational equivalence quotients for cross-model LLM state interfaces"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Daniel Kaiser"}]
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
real = [
  "transformers>=4.56,<6",
  "huggingface-hub>=0.34",
  "safetensors>=0.6",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
frank-eq = "frank_eq.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
