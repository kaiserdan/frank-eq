schema: frank_eq_moment_compute_registration_v1
protocol_version: stage-m0-operation-closed-basis
run_name: frank-eq-moment-compute-m0
output_dir: runs/moment-compute-m0
require_revision_pins: true

models:
  - model_id: qwen3-4b
    hf_id: Qwen/Qwen3-4B
    role: founder
    revision: 1cfa9a7208912126459214e8b04321603b3df60c
  - model_id: qwen3-8b
    hf_id: Qwen/Qwen3-8B
    role: founder
    revision: b968826d9c46dd6066d109eabc6255188de91218

capture:
  normalized_depths: [0.50]
  max_length: 2048
  dtype: bfloat16
  device: cuda
  branch_mode: kv_reuse
  allow_exact_replay_fallback: false
  answer_token_pairs:
    - [" A", " B"]
    - ["A", "B"]
    - [" No", " Yes"]
  branch_seed: 260831
  branch_batch_size: 8
  local_files_only: true
  prompt_format: chat_turn
  chat_template_kwargs:
    enable_thinking: false
  parity_sample_size: 0
  parity_max_abs_diff: 0.01

panel:
  entity_counts: [4]
  worlds_per_complexity: 64
  n_target_operations: 32
  n_renderers: 2
  calibration_fraction: 0.50
  selection_fraction: 0.20
  oracle_smoothing: 0.02
  min_operation_positive_fraction: 0.12
  max_operation_positive_fraction: 0.88
  max_generation_attempts: 512
  seed: 20260831

protocols:
  candidate_false: " false"
  candidate_true: " true"
  basis_protocol: sequence
  target_protocols: [answer_token, sequence, reason, pause]
  compute_families: [mutual, compose, compare_outdegree, counterfactual_add]
  rationale_budget: 32
  pause_budget: 32
  pause_text: " ..."
  reasoning_instruction: >-
    Work through the registered operation before answering. Use the following
    scratchpad positions to reason, and do not give the final answer yet.
  final_cue: "\nNow give only the final truth value. Final answer:"
  sequence_cue: "\nGive only the final truth value. Answer:"
  normalize_sequence_log_likelihood: true
  max_saved_reasoning_characters: 512

evaluation:
  bootstrap_replicates: 2000
  bootstrap_seed: 260831
  calibration_l2: 0.001
  calibration_max_steps: 100
  ece_bins: 10
  probability_epsilon: 0.0000001

gates:
  min_event_brier_gain_lower95: 0.0
  min_event_balanced_accuracy_lower95: 0.55
  min_moment_over_marginal_gain_lower95: 0.0
  min_moment_over_direct_gain_lower95: 0.0
  min_atomic_retention_lower95: -0.000000000001
  max_executor_mismatches: 0

authorization:
  development_only: true
  held_sender_authorized: false
  claim_bearing_test_authorized: false
  successor_protocol_draft_requires_pass: true
  receiver_protocol_draft_authorized: false
  receiver_execution_authorized: false
  scientific_claim_authorized: false
  paper_claim_authorized: false

logging:
  wandb:
    enabled: true
    project: frank-eq-moment-compute
    tags: [frank-eq, stage-m0, operation-closed-basis, development, olivia]
    offline: false
